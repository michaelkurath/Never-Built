name: TRMNL

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exhibit_offset: [0, 1, empty]
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - uses: browser-actions/setup-firefox@v1

      - name: Install render dependencies
        run: |
          # Avoid long Azure mirror timeouts in the disposable hosted runner.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          sudo apt-get install --yes --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=30 imagemagick
          gem install trmnl_preview --version 0.14.2

      - name: Validate data and rotation
        run: |
          node scripts/validate-data.js
          node scripts/validate-candidates.js
          node scripts/validate-assets.js
          node scripts/test-transform.js
          node scripts/test-catalogue.js
          node scripts/build-website.js

      - name: Lint plugin
        run: trmnlp lint

      - name: Pin exhibit and local artwork for review
        run: node scripts/prepare-render-fixture.js ${{ matrix.exhibit_offset }}

      - name: Render TRMNL OG, X landscape, and X portrait
        run: |
          python3 -m http.server 4568 --bind 127.0.0.1 > /tmp/assets.log 2>&1 &
          assets_pid=$!
          trmnlp serve --bind 127.0.0.1 > /tmp/trmnlp.log 2>&1 &
          trmnlp_pid=$!
          trap 'kill "$trmnlp_pid" "$assets_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4567/full > /dev/null; then
              break
            fi
            if ! kill -0 "$trmnlp_pid" 2>/dev/null; then
              cat /tmp/trmnlp.log
              exit 1
            fi
            sleep 1
          done

          mkdir -p _build-og _build-x _build-x-portrait
          for view in full half_horizontal half_vertical quadrant; do
            curl --get --fail --silent --show-error --retry 2 --retry-all-errors \
              --data-urlencode "screen_classes=screen screen--1bit screen--og_png screen--md screen--density-1x screen--1x" \
              --data "width=800" --data "height=480" --data "color_depth=1" \
              "http://127.0.0.1:4567/render/${view}.png" \
              --output "_build-og/${view}.png"
            curl --get --fail --silent --show-error --retry 2 --retry-all-errors \
              --data-urlencode "screen_classes=screen screen--4bit screen--v2 screen--lg screen--density-2x screen--1x" \
              --data "width=1040" --data "height=780" --data "color_depth=4" \
              "http://127.0.0.1:4567/render/${view}.png" \
              --output "_build-x/${view}.png"
            curl --get --fail --silent --show-error --retry 2 --retry-all-errors \
              --data-urlencode "screen_classes=screen screen--4bit screen--v2 screen--lg screen--portrait screen--density-2x screen--1x" \
              --data "width=780" --data "height=1040" --data "color_depth=4" \
              "http://127.0.0.1:4567/render/${view}.png" \
              --output "_build-x-portrait/${view}.png"
          done

      - name: Upload render previews
        uses: actions/upload-artifact@v6
        with:
          name: never-built-render-previews-${{ matrix.exhibit_offset }}
          path: |
            _build-og/*.png
            _build-x/*.png
            _build-x-portrait/*.png

