---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
refresh_interval_floor: ''
polling_url: https://raw.githubusercontent.com/michaelkurath/Never-Built/main/data/poll.json
polling_headers: ''
polling_body: ''
id: 498879
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About NEVER BUILT
  category: custom,education
  description: A rotating museum of real proposals for buildings, vehicles, and inventions that never became reality.
  github_url: https://github.com/michaelkurath/Never-Built
- keyname: category
  name: Category
  field_type: select
  options:
  - All categories: all
  - Technology: technology
  - Architecture: architecture
  - Transport: transport
  - Space: space
  - Infrastructure: infrastructure
  default: all
  description: Choose from all entries or one category. Every entry is shown once before the rotation repeats.
  optional: true
- keyname: display_edition
  name: Display edition
  field_type: select
  options:
  - Automatic: auto
  - Classic: classic
  - Frame: frame
  default: auto
  conditional_validation:
  - when: auto
    visible:
    - exhibit_ids
  - when: classic
    visible:
    - exhibit_ids
  - when: frame
    visible:
    - frame_exhibit_ids
  description: Automatic uses the gallery layout on TRMNL Frame. Choose Classic or Frame to override the full-screen layout.
  optional: true
- keyname: exhibit_mode
  name: Exhibit rotation
  field_type: select
  options:
  - Full Collection: all
  - My Selection: selected
  default: all
  description: My Selection uses your chosen exhibits across categories.
  optional: true
- keyname: exhibit_ids
  name: My exhibits
  field_type: string
  description: <a href="https://michaelkurath.github.io/Never-Built/picker.html?recipe=Never-Built">Choose exhibits</a>, then paste your selection here.
  optional: true
- keyname: frame_exhibit_ids
  name: My Frame exhibits
  field_type: string
  description: <a href="https://michaelkurath.github.io/Never-Built/picker.html?recipe=Never-Built&amp;edition=frame">Choose Frame artwork</a>, then paste your selection here.
  optional: true
- keyname: frame_caption
  name: Frame presentation
  field_type: select
  options:
  - Artwork only: artwork
  - Caption overlay: overlay
  default: artwork
  description: Show full-screen artwork alone or add a short description in the corner.
  optional: true
- keyname: frame_show_title
  name: Show title in Artwork only
  field_type: boolean
  default: false
  description: Add the exhibit title when Frame presentation is set to Artwork only.
  optional: true
name: NEVER BUILT
description: One unbuilt future, every refresh.
refresh_interval: 15
