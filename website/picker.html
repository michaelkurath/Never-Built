<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose exhibits</title>
  <link rel="stylesheet" href="picker.css">
  <script src="picker.js" defer></script>
</head>
<body>
  <main>
    <h1 id="title">Choose exhibits</h1>
    <p id="instructions">Choose one exhibit to keep it on screen, or several to rotate.</p>
    <label for="search">Find an exhibit</label>
    <input type="search" id="search" autocomplete="off" disabled>
    <p id="status" role="status">Loading the live catalogue…</p>
    <div id="choices"></div>
    <section aria-label="Copy your selection" id="selection" hidden>
      <label for="selection-value">Paste this selection into <strong id="field-name">My exhibits</strong> in TRMNL.</label>
      <input id="selection-value" type="text" readonly>
      <button id="copy" type="button" disabled>Copy selection</button>
      <span id="copy-status" role="status"></span>
    </section>
  </main>
</body>
</html>
